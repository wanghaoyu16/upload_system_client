<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作业上传系统</title>
    <link rel="stylesheet" href="./static/css/fontawesome.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #e8f4fd 0%, #d0eaf8 50%, #b8dff5 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 48px 40px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(77, 166, 232, 0.15);
            max-width: 460px;
            width: 90%;
        }
        .icon-circle {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4da6e8, #7ec8f8);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 32px;
            color: white;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: #1a1f36;
        }
        .notice {
            color: #e67e22;
            background: #fef9e7;
            border: 1px solid #f9e79f;
            border-radius: 10px;
            padding: 14px 18px;
            font-size: 0.9rem;
            line-height: 1.7;
            margin-bottom: 24px;
            text-align: left;
        }
        .notice i {
            margin-right: 6px;
        }
        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, #4da6e8, #3b9fd4);
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 50px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.15s, box-shadow 0.15s;
            box-shadow: 0 4px 16px rgba(77, 166, 232, 0.35);
        }
        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(77, 166, 232, 0.45);
        }
        .download-btn:active {
            transform: translateY(0);
        }
        .version {
            margin-top: 16px;
            font-size: 0.8rem;
            color: #999;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="icon-circle">
        <i class="fas fa-cloud-download-alt"></i>
    </div>
    <h1>作业上传系统</h1>
    <div class="notice">
        <p><i class="fas fa-exclamation-triangle"></i> <strong>Web端及Web版快捷方式已停止支持</strong></p>
        <p style="margin-top: 6px;">请下载最新版作业上传系统客户端软件使用</p>
    </div>
    <a class="download-btn" id="downloadBtn" href="#">
        <i class="fas fa-download"></i> 下载最新版安装包
    </a>
    <p class="version" id="versionText">正在获取版本信息...</p>
</div>
<script>
(async function() {
    try {
        var resp = await fetch('/api/check_update');
        var data = await resp.json();
        var btn = document.getElementById('downloadBtn');
        var txt = document.getElementById('versionText');
        btn.href = data.download_url || '/file/app/upload-system-client-1.3.1.exe';
        txt.textContent = '版本 ' + (data.version || '1.3.1') + ' · Windows';
    } catch(e) {
        document.getElementById('versionText').textContent = '版本 1.3.1 · Windows';
        document.getElementById('downloadBtn').href = '/file/app/upload-system-client-1.3.1.exe';
    }
})();
</script>
</body>
</html>
