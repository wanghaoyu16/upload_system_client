<script>
(function () {
  var API = window.electronAPI;
  function winCtrl(sel, fn) {
    var el = document.querySelector(sel);
    if (el) el.addEventListener('click', function(e) { e.stopPropagation(); if (API && API[fn]) API[fn](); });
  }
  winCtrl('.windows_icon_bg:nth-child(1)', 'minimize');
  winCtrl('.windows_icon_bg:nth-child(2)', 'maximize');
  winCtrl('.close_icon', 'close');
  winCtrl('.download_btn', 'minimize');

  var iframe = document.getElementById('main-frame');
  var xxtView = document.getElementById('xxt-view');
  var xxtUrls = { class:'https://mooc2-ans.chaoxing.com/visit/interaction', note:'https://groupyd2.chaoxing.com/pc/activity/activityList', cloud:'https://pan-yz.chaoxing.com/pcuserpan/index' };
  var targetTab = '课程';

  var pageMap = { home:'home', message:'home', note:'xxt', class:'xxt', cloud:'xxt', group:'home', appearance:'appearance', setting:'settings' };

  function nav(page) {
    if (page === 'xxt') {
      iframe.style.display = 'none';
      xxtView.style.visibility = 'visible';
      xxtView.style.position = 'relative';
      var url = xxtUrls[targetTab] || xxtUrls['class'];
      if (xxtView.src !== url) xxtView.src = url;
      return;
    }
    xxtView.style.visibility = 'hidden';
    xxtView.style.position = 'absolute';
    iframe.style.display = '';
    try { iframe.contentWindow.switchPage(page); } catch(e) {}
  }

  if (xxtView) {
    xxtView.addEventListener('dom-ready', function() {
      try { xxtView.setUserAgent('Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) cxstudy/1.4.5 Chrome/150.0.7871.224 Electron/43.4.0 Safari/537.36 osVersion_10.0.26300 osArch_0 (schild:7204d6e5f16219ffd702bf20b1ac393a) (device:x64) Language/zh_CN com.chaoxing.cxstudy/ChaoXingStudy_1000371_1.4.5_windows_pc_202611041930_258 (@Kalimdor)_441cf2e6072446a690668944fdd0a90e668c6c307f2c0605af5278a91e35b771'); } catch(e) {}
    });
  }

  iframe.addEventListener('load', function() {
    var doc = iframe.contentDocument;
    if (!doc) return;
    var s = doc.createElement('style');
    s.textContent = '#titlebar,#sidebar,.corner-fill,.sidebar-toggle,#splash-screen,.splash-ring,.splash-progress,#global-progress{display:none!important}body{-webkit-app-region:no-drag!important}body.splash-active{overflow:auto!important}#main-content{border-radius:0!important}';
    doc.head.appendChild(s);
    setTimeout(function() {
      var ss = doc.getElementById('splash-screen'); if (ss) ss.remove();
      doc.body.classList.remove('splash-active');
      nav('home');
    }, 300);
    function updateShellAvatar() {
      try {
        var cached = iframe.contentWindow.localStorage.getItem('cachedUserInfo');
        var realName = '';
        if (cached) {
          try { var ud = JSON.parse(cached); realName = ud.username || ''; } catch(e) {}
        }
        if (!realName) realName = iframe.contentWindow.localStorage.getItem('nickname') || '';
        var ava = iframe.contentWindow.localStorage.getItem('avatar');
        var nameDiv = document.querySelector('.aside_avator_name');
        var imgEl = document.querySelector('.aside_avator_img img');
        if (nameDiv && realName) nameDiv.textContent = realName;
        if (imgEl && ava) imgEl.src = ava;
      } catch(e) {}
    }
    updateShellAvatar();
    var avatarPollCount = 0;
    var avatarPoll = setInterval(function() {
      updateShellAvatar();
      avatarPollCount++;
      if (avatarPollCount > 10) clearInterval(avatarPoll);
    }, 500);
  });

  var menu = document.querySelector('.aside_menu');
  if (menu) {
    menu.addEventListener('click', function(e) {
      var item = e.target.closest('.aside_menu_item');
      if (!item) return;
      var isSet = item.classList.contains('aside_menu_item_setting');
      var viewId = isSet ? 'setting' : item.getAttribute('data-view');
      var page = pageMap[viewId];
      if (page === 'xxt') {
        targetTab = viewId === 'class' ? '课程' : (viewId === 'note' ? '笔记' : '云盘');
      }
      menu.querySelectorAll('.aside_menu_item').forEach(function(i) {
        i.classList.remove('aside_menu_item_active');
        var svg = i.querySelector('.svg-icon');
        if (svg) svg.style.setProperty('--color', '#ACB4BF');
      });
      item.classList.add('aside_menu_item_active');
      var svg = item.querySelector('.svg-icon');
      if (svg) svg.style.setProperty('--color', '#fff');
      if (page) nav(page);
    });
  }

  var tool = document.querySelector('.aside_tool');
  var aside = document.querySelector('.aside');
  var mainView = document.querySelector('.warpper_main_view');
  if (tool && aside) {
    tool.addEventListener('click', function() {
      var c = aside.classList.toggle('aside_hide');
      tool.classList.toggle('is-collapsed', c);
      if (mainView) { mainView.classList.toggle('width120', !c); mainView.classList.toggle('width60', c); }
    });
  }
})();
</script>
